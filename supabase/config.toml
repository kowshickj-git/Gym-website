# Local development configuration for `supabase start`.
# Production settings live in the Supabase dashboard.

project_id = "iron-core-gym"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

# Phone auth is handled by the application's own OTP service
# (src/lib/auth/otp.ts) so the gym can use an Indian SMS gateway such as MSG91.
# Supabase's built-in phone provider stays off.
[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false
